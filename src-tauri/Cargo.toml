[package]
name = "focusmimi"
version = "0.1.0"
description = "FOCUS by MIMI desktop application"
authors = ["FOCUS by MIMI"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "focusmimi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.3", features = [] }
